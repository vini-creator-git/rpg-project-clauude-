<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta · Hub de Fichas</title>
<link rel="stylesheet" href="style.css">
<script>document.documentElement.dataset.tema = localStorage.getItem("hub-tema") || "escuro";</script>
</head>
<body>

<header class="topo-auth">
  <span class="brand">Hub de Fichas</span>
  <span id="temaSlot"></span>
</header>

<main class="auth-wrap">
  <section class="auth-box card">
    <h1>Criar conta</h1>
    <input id="nome" placeholder="Seu nome" autocomplete="name">
    <input id="email" type="email" placeholder="E-mail" autocomplete="email">
    <input id="senha" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="new-password">
    <input id="confirmar" type="password" placeholder="Confirme a senha" autocomplete="new-password">
    <button class="primary" id="btnCriar">Criar conta</button>
    <hr>
    <p class="dica">Já tem conta? <a href="entrar.html">Entrar</a></p>
    <p id="msg" class="msg"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script>
const $ = s => document.querySelector(s);

function aviso(texto, ok = false) {
  const m = $("#msg");
  m.textContent = texto;
  m.className = "msg " + (ok ? "ok" : "erro");
}

$("#temaSlot").append(botaoTema());
pularSeLogado();

$("#btnCriar").onclick = async () => {
  const nome = $("#nome").value.trim();
  const email = $("#email").value.trim();
  const senha = $("#senha").value;
  const confirmar = $("#confirmar").value;

  if (!nome || !email || !senha) return aviso("Preencha todos os campos.");
  if (senha.length < 6) return aviso("A senha precisa ter no mínimo 6 caracteres.");
  if (senha !== confirmar) return aviso("As senhas não coincidem.");

  const botao = $("#btnCriar");
  botao.disabled = true;
  const { data, error } = await sb.auth.signUp({
    email,
    password: senha,
    options: { data: { nome } }
  });
  botao.disabled = false;

  if (error) return aviso(traduzirErro(error.message));
  if (data.session) return location.replace("hub.html");

  // Projeto com confirmação de e-mail ativa
  aviso("Conta criada! Confira seu e-mail para confirmar o cadastro e depois entre.", true);
};

$("#confirmar").addEventListener("keydown", e => { if (e.key === "Enter") $("#btnCriar").click(); });
</script>
</body>
</html>
